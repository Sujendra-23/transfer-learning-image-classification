name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  serving:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: serving/requirements.txt
      # The service tests build a tiny stub model, so no weights or dataset are needed.
      - run: pip install tensorflow-cpu==2.16.2 keras==3.15.0 "numpy<2" -r serving/requirements.txt httpx pytest
      - run: python -m pytest -q
        env:
          TF_CPP_MIN_LOG_LEVEL: '2'
